<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffc9dc"/>
      <stop offset="38%" stop-color="#f472b6"/>
      <stop offset="72%" stop-color="#4a153b"/>
      <stop offset="100%" stop-color="#050205"/>
    </linearGradient>
    <linearGradient id="nx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd9e7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="300" cy="250" r="150" fill="#ffffff" opacity="0.16"/>
  <circle cx="760" cy="800" r="210" fill="#f472b6" opacity="0.20"/>
  <g filter="url(#glow)">
    <text x="512" y="640" text-anchor="middle"
          font-family="DejaVu Sans, Liberation Sans, sans-serif" font-weight="900"
          font-size="360" letter-spacing="6" fill="url(#nx)">NX</text>
  </g>
  <text x="512" y="756" text-anchor="middle"
        font-family="DejaVu Sans Mono, monospace" font-weight="700"
        font-size="74" letter-spacing="10" fill="#ffd9e7" opacity="0.85">NEXUS</text>
</svg>
